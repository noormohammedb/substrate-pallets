[package]
edition.workspace = true
name = "pallet-token-distribution"
description = "A minimal pallet built with FRAME, part of Polkadot Sdk. (polkadot v1.15.0)"
version = "0.1.0"
license = "Unlicense"
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { version = "3.6.12", default-features = false, package = "parity-scale-codec", features = [
  "derive",
] }
polkadot-sdk-frame = { version = "0.6.0", features = [
  "runtime",
  "experimental",
] }
scale-info = { version = "2.11.1", default-features = false, features = [
  "derive",
] }


[features]
default = ["std"]
std = ["codec/std", "polkadot-sdk-frame/std", "scale-info/std"]

[dev-dependencies]
pallet-balances = "38.0.0"
